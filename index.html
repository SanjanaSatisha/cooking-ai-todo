<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cooking To-Do Planner</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --dark: #2D3436;
            --light: #F7F9F9;
            --success: #00B894;
            --danger: #D63031;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: var(--dark);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            color: var(--primary);
            font-size: 2.4em;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #636e72;
            font-size: 1.1em;
            margin: 0;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
            font-size: 1em;
            color: var(--dark);
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        input:focus,
        textarea:focus {
            border-color: var(--secondary);
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            border: none;
            padding: 16px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 35px;
        }

        .card {
            background: white;
            border: 1px solid #f1f2f6;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .card.full-width {
            grid-column: 1 / -1;
        }

        .card h3 {
            margin-top: 0;
            color: var(--dark);
            border-bottom: 3px solid var(--secondary);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #f1f2f6;
        }

        th {
            font-weight: 600;
            color: #636e72;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }

        .total-row {
            font-weight: 700;
            font-size: 1.1em;
            color: var(--dark);
            background: #f8f9fa;
        }

        ul {
            padding-left: 20px;
            margin: 0;
        }

        li {
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .hidden {
            display: none !important;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            color: white;
            letter-spacing: 0.5px;
        }

        .badge.success {
            background: var(--success);
        }

        .badge.danger {
            background: var(--danger);
        }

        @media (max-width: 600px) {
            .results-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>👩‍🍳 Gen-AI Cooking Planner</h1>
            <p class="subtitle">Smart meal prep, itemized groceries, and budget tracking.</p>
        </header>

        <div class="form-group">
            <label for="dayDescription">📅 How does your day look?</label>
            <textarea id="dayDescription" rows="3"
                placeholder="Example: Busy workday, heavy workout day, or a lazy Sunday..."></textarea>
        </div>

        <div class="form-group">
            <label for="budget">💰 Daily Food Budget (INR / USD)</label>
            <input type="number" id="budget" value="500" placeholder="Enter your maximum budget">
        </div>

        <div class="btn-group">
            <!-- The button stays visible now so you can keep updating -->
            <button class="btn-primary" id="generateBtn">✨ Generate Smart Plan</button>
        </div>

        <div id="resultArea" class="results-grid hidden">

            <div class="card full-width">
                <h3>🍽️ AI Suggested Meal Plan</h3>
                <div id="mealPlan"></div>
            </div>

            <div class="card">
                <h3>🛒 Itemized Grocery List</h3>
                <div id="groceryList"></div>
            </div>

            <div class="card">
                <h3>💰 Budget Feasibility</h3>
                <div id="budgetStatus"></div>

                <h3 style="margin-top: 30px;">🔄 Smart Substitutions</h3>
                <div id="substitutions"></div>
            </div>

        </div>
    </div>

    <script>
        class MealPlannerEngine {
            constructor(dayProfile, maxBudget) {
                this.dayProfile = dayProfile.toLowerCase();
                this.maxBudget = maxBudget;
            }

            generateData() {
                const isBusy = this.dayProfile.includes('busy') || this.dayProfile.includes('work');

                const meals = isBusy ?
                    { breakfast: "Overnight Oats with Chia & Honey 🥣", lunch: "One-Pot Quinoa & Veggie Bowl 🍱", dinner: "Comforting Dal Khichdi 🍲" } :
                    { breakfast: "Avocado Toast & Poached Eggs 🍳", lunch: "Hearty Multi-grain Veggie Thali 🍛", dinner: "Grilled Protein Salad 🥗" };

                const groceries = isBusy ? [
                    { item: "Rolled Oats & Chia", cost: 80 },
                    { item: "Quinoa / Rice", cost: 110 },
                    { item: "Mixed Vegetables", cost: 90 },
                    { item: "Lentils (Dal)", cost: 60 },
                    { item: "Honey & Spices", cost: 40 }
                ] : [
                    { item: "Avocado / Spreads", cost: 150 },
                    { item: "Eggs / Chickpeas", cost: 70 },
                    { item: "Fresh Greens & Veggies", cost: 120 },
                    { item: "Premium Protein (Chicken/Tofu)", cost: 160 }
                ];

                const substitutions = isBusy ?
                    ["Swap Quinoa for standard Rice (Saves ₹40)", "Use canned beans if out of Lentils"] :
                    ["Swap Avocado for Peanut Butter (Saves ₹100)", "Swap premium protein for Soya Chunks (Saves ₹80)"];

                return { meals, groceries, substitutions };
            }
        }

        const AppController = {
            init() {
                document.getElementById('generateBtn').addEventListener('click', () => this.handleGenerate());
            },

            handleGenerate() {
                const descInput = document.getElementById('dayDescription').value || "regular day";
                const budgetInput = parseFloat(document.getElementById('budget').value) || 500;

                const engine = new MealPlannerEngine(descInput, budgetInput);
                const planData = engine.generateData();

                this.renderResults(planData, budgetInput);

                // Update button text to indicate the form is still active
                document.getElementById('generateBtn').innerHTML = "✨ Update Smart Plan";
            },

            renderResults(data, maxBudget) {
                document.getElementById('mealPlan').innerHTML = `
            <p><strong>Breakfast:</strong> ${data.meals.breakfast}</p>
            <p><strong>Lunch:</strong> ${data.meals.lunch}</p>
            <p><strong>Dinner:</strong> ${data.meals.dinner}</p>
        `;

                let totalCost = 0;
                let tableHTML = `<table><thead><tr><th>Ingredient</th><th>Est. Cost</th></tr></thead><tbody>`;

                data.groceries.forEach(g => {
                    tableHTML += `<tr><td>${g.item}</td><td>₹${g.cost.toFixed(2)}</td></tr>`;
                    totalCost += g.cost;
                });

                tableHTML += `</tbody><tfoot><tr class="total-row"><td>Total Basket Cost</td><td>₹${totalCost.toFixed(2)}</td></tr></tfoot></table>`;
                document.getElementById('groceryList').innerHTML = tableHTML;

                document.getElementById('substitutions').innerHTML = `<ul>` + data.substitutions.map(s => `<li>${s}</li>`).join('') + `</ul>`;

                const isFeasible = totalCost <= maxBudget;
                const badgeHTML = isFeasible ? `<span class="badge success">FEASIBLE</span>` : `<span class="badge danger">OVER BUDGET</span>`;

                document.getElementById('budgetStatus').innerHTML = `
            <div style="margin-bottom: 15px;">
                <p>Target Budget: <strong>₹${maxBudget.toFixed(2)}</strong></p>
                <p>Calculated Cost: <strong>₹${totalCost.toFixed(2)}</strong> ${badgeHTML}</p>
            </div>
            <p style="font-size: 0.9em; color: #636e72;">
                ${isFeasible ? '✅ Excellent! Your planned meals fit comfortably within your daily limit.' : '⚠️ You exceed your budget! Check the smart substitutions below to lower your basket cost.'}
            </p>
        `;

                document.getElementById('resultArea').classList.remove('hidden');
            }
        };

        document.addEventListener('DOMContentLoaded', () => AppController.init());
    </script>

</body>

</html>
